{%- if site.analytics_id %}
{%- assign site_host = site.url | remove: "https://" %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics_id }}"></script>
  <script>
    /* Audience measurement with Google Analytics cookies (_ga, _ga_*), and nothing more: every
       advertising signal is denied, so no data feeds ads or remarketing. The cookies last 13 months
       instead of Google's two years; the privacy page states both, keep them in step. Keep the
       consent call before config. The hostname check keeps local previews and any mirror out of
       the property. */
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      analytics_storage: 'granted', ad_storage: 'denied',
      ad_user_data: 'denied', ad_personalization: 'denied'
    });
    gtag('js', new Date());
    gtag('config', '{{ site.analytics_id }}', {
      send_page_view: location.hostname === '{{ site_host }}',
      allow_google_signals: false,
      cookie_expires: 34128000
    });
  </script>
{%- endif %}
