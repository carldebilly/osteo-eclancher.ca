{%- assign t = site.data.i18n[page.lang] -%}
{%- assign home = site.pages | where: "ref", "home" | where: "lang", page.lang | first -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": {{ t.breadcrumb.home | jsonify }},
      "item": {{ home.url | absolute_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.title | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }
  ]
}
</script>
